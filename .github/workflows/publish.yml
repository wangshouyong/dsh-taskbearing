name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance（OIDC）

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    env:
      # 允许在尚未配置 npm 凭据时「跳过发布」而不是让 tag 发布一直红叉。
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: install (build + tests need devDependencies)
        run: npm install --no-audit --no-fund
      - name: gate (tests + doc mirrors)
        run: node --test && node scripts/check-docs-en.mjs
      - name: publish with provenance
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: publish skipped (no NPM_TOKEN)
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN 未配置，跳过 npm 发布；GitHub Release tarball 仍可安装。"
