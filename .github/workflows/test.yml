name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node-test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # 与 npm publish 工作流（ubuntu-latest 上跑 node --test）保持同平台覆盖，
        # 避免「Windows 绿、ubuntu 红」再次把 publish gate 卡死（P1 回归）。
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: unit tests
        run: node --test

  build-client:
    name: build-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build:client
      - name: verify artifact
        run: node -e "const fs=require('fs'); if(!fs.existsSync('lib/client.js')) { console.error('lib/client.js missing'); process.exit(1); }"

  docs-mirror:
    name: docs-mirror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: check English doc mirrors
        run: node scripts/check-docs-en.mjs
